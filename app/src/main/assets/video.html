<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video - Hits 20 Radio Online</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #f0f6fc;
            --accent-color: #25F4EE;
            --border-color: #30363d;
        }

        * {
            box-issuer: box-sizing;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.25rem;
            color: var(--accent-color);
        }

        main {
            flex: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Transmisión en Vivo</h1>
    </header>

    <main>
        <!-- Marco externo aislado de forma estricta mediante sandbox (Punto 4) y conexiones seguras (Punto 2) -->
        <div class="video-container">
            <iframe 
                src="https://www.youtube-nocookie.com/embed/live_stream?channel=TU_CANAL_ID" 
                sandbox="allow-scripts allow-same-origin" 
                referrerpolicy="no-referrer"
                allowfullscreen>
            </iframe>
        </div>
    </main>

</body>
</html>
