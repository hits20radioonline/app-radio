<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hits 20 Radio Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030508;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 8px 12px;
            overflow-x: hidden;
        }

        /* Menú Lateral Desplegable */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .drawer-overlay.active {
            display: block;
            opacity: 1;
        }
        .drawer-menu {
            position: fixed;
            top: 0; left: -75vw; width: 75vw; max-width: 300px; height: 100%;
            background-color: #05080f;
            z-index: 10000;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #121d33;
            overflow-y: auto;
        }
        .drawer-menu.active {
            left: 0;
        }
        .drawer-header {
            padding: 20px 15px;
            text-align: center;
            border-bottom: 1px solid #121d33;
            background-color: #030508;
        }
        .drawer-header h2 {
            font-size: 16px;
            color: #00E5FF;
            font-weight: bold;
        }
        .drawer-header p {
            font-size: 10px;
            color: #8A99AD;
            word-break: break-all;
            margin-top: 4px;
        }
        .drawer-section-title {
            font-size: 11px;
            color: #8A99AD;
            padding: 15px 15px 5px 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .drawer-items {
            padding: 5px 0;
            display: flex;
            flex-direction: column;
        }
        .drawer-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            transition: background 0.2s;
        }
        .drawer-item:hover {
            background-color: #0e1726;
            color: #00E5FF;
        }
        .drawer-item svg {
            width: 20px;
            height: 20px;
            fill: #00E5FF;
            flex-shrink: 0;
        }

        /* Barra Superior */
        .header-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 420px;
            margin: 0 auto 4px auto;
            position: relative;
            z-index: 100;
        }
        .top-menu-btn, .top-share-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-section { width: 100%; text-align: center; padding-top: 10px; position: relative; }
        
        .main-content {
            width: 100%;
            max-width: 420px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }

        .player-card {
            width: 100%;
            background-color: #05080f;
            border: 1px solid #121d33;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .live-badge {
            background-color: #e50914;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 8px;
            display: inline-block;
        }

        .now-playing {
            font-size: 10px;
            color: #8A99AD;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .song-title {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 2px;
        }

        .song-artist {
            font-size: 12px;
            color: #00E5FF;
            margin-bottom: 12px;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 10px;
            color: #8A99AD;
            border-top: 1px solid #121d33;
            border-bottom: 1px solid #121d33;
            padding: 6px 0;
            margin-bottom: 15px;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #8A99AD;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            gap: 2px;
        }

        .play-main-btn {
            width: 50px;
            height: 50px;
            background-color: #00E5FF;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #030508;
        }

        .volume-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: #8A99AD;
            margin-bottom: 15px;
        }

        .volume-slider {
            flex: 1;
            accent-color: #00E5FF;
            cursor: pointer;
        }

        .social-icons {
            display: flex;
            justify-content: space-around;
            width: 100%;
            border-top: 1px solid #121d33;
            padding-top: 12px;
        }

        .social-icon-btn {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8A99AD;
            font-size: 9px;
            cursor: pointer;
            gap: 4px;
            text-decoration: none;
        }

        .social-icon-btn svg {
            width: 20px;
            height: 20px;
            fill: #00E5FF;
        }

        nav.bottom-nav { width: calc(100% + 24px); height: 48px; background-color: #05080f; display: flex; margin: 0 -12px -8px -12px; border-top: 1px solid #121d33; position: relative; z-index: 100; }
        .tab-btn { flex: 1; background: none; border: none; color: #8A99AD; font-weight: bold; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; }
        .tab-active { background-color: #0e1726; color: #00E5FF; }
        .tab-active::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background-color: #00E5FF; }
    </style>
</head>
<body>

    <!-- Menú Lateral Desplegable -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleMenu()"></div>
    <div class="drawer-menu" id="drawerMenu">
        <div class="drawer-header">
            <h2>HITS20</h2>
            <p>hits20radioonline.com</p>
        </div>

        <div class="drawer-section-title">Redes Sociales</div>
        <div class="drawer-items">
            <a href="https://www.youtube.com/@hits20radio" class="drawer-item" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.377.505 9.377.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                YouTube
            </a>
            <a href="https://www.tiktok.com/@hits20online?_r=1&_t=ZS-980S8qdbZa9" class="drawer-item" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.77 0 2.89 2.89 0 0 1 2.5-2.87V9.75a6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V6.69a6.6 6.6 0 0 0 3.69 1.1v-3.5a4.7 4.7 0 0 1-3.69-1.1z"/></svg>
                TikTok
            </a>
            <a href="https://www.threads.net/@hits20online" class="drawer-item" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z"/></svg>
                Threads
            </a>
        </div>

        <div class="drawer-section-title">Información</div>
        <div class="drawer-items">
            <a href="#" class="drawer-item">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                Contacto
            </a>
            <a href="#" class="drawer-item">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                Acerca de
            </a>
        </div>
    </div>

    <div class="header-section">
        <div class="header-top-bar">
            <button class="top-menu-btn" onclick="toggleMenu()">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <button class="top-share-btn" onclick="shareApp()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
            </button>
        </div>
        <h2 style="font-size: 13px; color: #00E5FF; letter-spacing: 1px; margin-bottom: 2px;">HITS 20</h2>
        <h1 style="font-size: 15px; font-weight: bold; color: #ffffff;">RADIO ONLINE</h1>
    </div>

    <div class="main-content">
        <div class="player-card">
            <div style="font-weight: bold; font-size: 16px; color: #00E5FF; letter-spacing: 1px;">HITS20 RADIO</div>
            <div class="live-badge">EN VIVO</div>

            <div class="now-playing">AHORA SUENA</div>
            <div class="song-title">HITS 20 RADIO ONLINE V2</div>
            <div class="song-artist">Transmisión Oficial</div>

            <div class="meta-info">
                <span>GÉNERO: HITS</span>
                <span>128 kbps</span>
            </div>

            <div class="controls-row">
                <button class="control-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                    15
                </button>
                <button class="play-main-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="control-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
                    15
                </button>
            </div>

            <div class="volume-container">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <input type="range" class="volume-slider" min="0" max="100" value="50">
                <span>50%</span>
            </div>

            <div class="social-icons">
                <a href="#" class="social-icon-btn">
                    <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                    Facebook
                </a>
                <a href="#" class="social-icon-btn">
                    <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" fill="none" stroke="#030508" stroke-width="2"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke="#030508" stroke-width="2"/></svg>
                    Instagram
                </a>
                <a href="#" class="social-icon-btn">
                    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                    WhatsApp
                </a>
                <a href="#" class="social-icon-btn">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    Sitio Web
                </a>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="tab-btn tab-active" onclick="window.location.href='index.html'">RADIO</button>
        <button class="tab-btn" onclick="window.location.href='video.html'">VIDEO</button>
    </nav>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('drawerMenu');
            const overlay = document.getElementById('drawerOverlay');
            menu.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({
                    title: 'Hits 20 Radio Online',
                    text: 'Escuchá Hits 20 Radio Online:',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('¡Enlace copiado al portapapeles!');
            }
        }
    </script>

</body>
</html>
