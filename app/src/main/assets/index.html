<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hits 20 Radio Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #05070D;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 8px 12px;
            overflow-x: hidden;
        }

        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .logo { width: 95%; max-height: 160px; object-fit: contain; margin: 10px 0; }
        .badge { background: linear-gradient(135deg, #FF1744, #D50000); padding: 2px 10px; border-radius: 20px; font-size: 9px; font-weight: bold; letter-spacing: 1px; }

        .equalizer { display: flex; align-items: flex-end; justify-content: center; height: 35px; gap: 2px; width: 100%; background: #0D131F; border-radius: 8px; padding: 4px; margin: 10px 0; }
        .bar { width: 3px; border-radius: 2px; background: linear-gradient(to top, #00B0FF, #7C4DFF, #FF1744); animation: bounce 0.9s infinite ease-in-out alternate; }
        @keyframes bounce { 0% { height: 4px; opacity: 0.4; } 100% { height: 26px; opacity: 1; } }
        .paused .bar { animation-play-state: paused; height: 4px !important; opacity: 0.3; }

        .info-container { text-align: center; margin-bottom: 10px; }
        .song-title { font-size: 14px; font-weight: bold; }
        
        .play-btn { background: none; border: none; cursor: pointer; width: 60px; height: 60px; }
        
        .social-row { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
        .social-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: white; }
        .social-circle { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
        
        /* Colores */
        .circle-fb { background-color: #1877F2; }
        .circle-ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #df5950 45%, #c62368 60%, #515ec4 90%); }
        .circle-wa { background-color: #25D366; }
        .circle-yt { background-color: #FF0000; }
        .circle-tt { background-color: #000000; border: 1px solid #333; }
        .circle-th { background-color: #101010; border: 1px solid #333; }
        .circle-mail { background-color: #EA4335; }
        .circle-web { background-color: #121826; border: 1px solid #00E5FF; }
        
        .social-item span { font-size: 8px; margin-top: 2px; }
        audio { display: none; }
    </style>
</head>
<body class="paused">

    <img src="hits20_logo.png" alt="Hits 20 Logo" class="logo">
    <div class="badge">● EN VIVO</div>

    <div class="equalizer paused" id="eqContainer">
        <!-- Barras del vúmetro -->
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <div class="info-container">
        <div class="song-title" id="songTitle">PAUSADO</div>
    </div>

    <audio id="radioStream" src="https://stream.radiosmundiales.com:8692/stream"></audio>

    <button class="play-btn" onclick="togglePlay()">
        <svg id="playIcon" viewBox="0 0 24 24" width="60" height="60" fill="#00E5FF">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
    </button>

    <!-- Redes Sociales Actualizadas -->
    <div class="social-row">
        <a href="https://www.facebook.com/hits20radio/" target="_blank" class="social-item">
            <div class="social-circle circle-fb">FB</div><span>Facebook</span>
        </a>
        <a href="https://www.instagram.com/hits20online/" target="_blank" class="social-item">
            <div class="social-circle circle-ig">IG</div><span>Instagram</span>
        </a>
        <a href="https://wa.me/5492664728261" target="_blank" class="social-item">
            <div class="social-circle circle-wa">WA</div><span>WhatsApp</span>
        </a>
        <a href="https://www.youtube.com/@hits20radio" target="_blank" class="social-item">
            <div class="social-circle circle-yt">YT</div><span>YouTube</span>
        </a>
        <a href="https://www.tiktok.com/@hits20online" target="_blank" class="social-item">
            <div class="social-circle circle-tt">TT</div><span>TikTok</span>
        </a>
        <a href="https://www.threads.net/@hits20online" target="_blank" class="social-item">
            <div class="social-circle circle-th">TH</div><span>Threads</span>
        </a>
        <a href="mailto:Hits20radioonline@gmail.com" class="social-item">
            <div class="social-circle circle-mail">@</div><span>Correo</span>
        </a>
        <a href="https://Hits20radioonline.com" target="_blank" class="social-item">
            <div class="social-circle circle-web">WEB</div><span>Web</span>
        </a>
    </div>

    <script>
        const audio = document.getElementById('radioStream');
        const eqContainer = document.getElementById('eqContainer');
        const playIcon = document.getElementById('playIcon');
        const songTitle = document.getElementById('songTitle');

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                eqContainer.classList.remove('paused');
                songTitle.innerText = "HITS20 RADIO ONLINE";
                playIcon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>';
            } else {
                audio.pause();
                eqContainer.classList.add('paused');
                songTitle.innerText = "PAUSADO";
                playIcon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>';
            }
        }
    </script>
</body>
</html>
