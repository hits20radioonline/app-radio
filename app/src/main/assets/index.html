<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hits 20 Radio Online v2</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #030508;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            height: 100%;
            padding: 8px 12px;
            overflow-x: hidden;
        }

        header.top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            width: 100%;
            max-height: 190px;
            object-fit: contain;
            margin: 2px 0;
        }

        .badge {
            background: linear-gradient(135deg, #FF1744, #D50000);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 23, 68, 0.5);
            margin: 2px 0;
        }

        /* Vúmetro Futurista Holográfico */
        .equalizer-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70px;
            position: relative;
            margin: 2px 0;
        }

        .cyber-equalizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            width: 100%;
            height: 100%;
        }

        .cyber-bar {
            width: 6px;
            background: linear-gradient(180deg, #FF1744, #7C4DFF, #00E5FF);
            border-radius: 4px;
            transition: height 0.04s ease, box-shadow 0.04s ease;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }

        .paused .cyber-bar {
            height: 4px !important;
            background: #0d162d !important;
            box-shadow: none !important;
        }

        .info-container {
            text-align: center;
        }
        .now-playing {
            color: #8A99AD;
            font-size: 8px;
            letter-spacing: 1px;
        }
        .song-title {
            font-size: 13px;
            font-weight: bold;
        }
        .song-artist {
            color: #B0BEC5;
            font-size: 10px;
        }

        .meta-row {
            display: flex;
            gap: 12px;
            font-size: 9px;
            color: #8FEFFF;
        }

        /* Botón Play Holográfico Gigante */
        .play-btn {
            background: radial-gradient(circle, rgba(0,229,255,0.15) 0%, rgba(5,7,13,0.8) 70%);
            border: 2px solid #00E5FF;
            border-radius: 50%;
            cursor: pointer;
            width: 74px;
            height: 74px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3), inset 0 0 10px rgba(0, 229, 255, 0.2);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .play-btn:active {
            transform: scale(0.94);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
        }

        .volume-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
        }
        .volume-container input[type=range] {
            flex: 1;
            accent-color: #00E5FF;
            height: 4px;
        }

        .social-row {
            width: 100%;
            display: flex;
            justify-content: space-around;
        }
        .social-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        .social-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
        }
        .circle-fb { background-color: #1877F2; }
        .circle-ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #df5950 45%, #c62368 60%, #515ec4 90%); }
        .circle-wa { background-color: #25D366; }
        .circle-web { background-color: #121826; border: 1px solid #00E5FF; }
        .social-item span {
            font-size: 9px;
            color: #FFFFFF;
        }

        /* Barra de navegación inferior actualizada estilo imagen 2 */
        nav.bottom-nav {
            width: calc(100% + 24px);
            height: 48px;
            background-color: #05080f;
            display: flex;
            margin: 0 -12px -8px -12px;
            border-top: 1px solid #121d33;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #8A99AD;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, color 0.2s;
            position: relative;
        }
        .tab-active {
            background-color: #0e1726;
            color: #00E5FF;
        }
        .tab-active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background-color: #00E5FF;
        }

        audio { display: none; }
    </style>
</head>
<body class="paused">

    <header class="top-bar">
        <span style="font-size: 18px; cursor: pointer;" onclick="toggleMenu()">☰</span>
        <span style="font-size: 15px; cursor: pointer;" onclick="toggleMenu()">🔗</span>
    </header>

    <main style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <img src="hits20_logo.png" alt="Hits 20 Logo" class="logo">

        <div class="badge">● EN VIVO</div>

        <!-- Vúmetro Futurista Onda Cibernética -->
        <section class="equalizer-wrapper" aria-label="Vúmetro futurista">
            <div class="cyber-equalizer" id="cyberEq"></div>
        </section>

        <section class="info-container">
            <div class="now-playing">ESTADO</div>
            <h1 class="song-title" id="songTitle" style="font-size: 13px; font-weight: bold;">PAUSADO</h1>
            <div class="song-artist">Transmisión Oficial</div>
        </section>

        <div class="meta-row">
            <span>🎵 GÉNERO: HITS</span>
            <span>📡 128 kbps</span>
        </div>

        <audio id="radioStream" preload="none" src="https://stream.radiosmundiales.com:8692/stream"></audio>

        <button class="play-btn" onclick="togglePlay()" aria-label="Reproducir o Pausar">
            <svg id="playIcon" viewBox="0 0 24 24" width="34" height="34" fill="#00E5FF">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
            </svg>
        </button>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" id="volumeBar" min="0" max="100" value="80" oninput="changeVolume(this.value)" aria-label="Control de volumen">
            <span id="volumeText" style="font-size: 9px;">80%</span>
        </div>

        <section class="social-row">
            <a href="https://facebook.com" target="_blank" rel="noopener" class="social-item">
                <div class="social-circle circle-fb">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="#FFFFFF"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                </div>
                <span>Facebook</span>
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener" class="social-item">
                <div class="social-circle circle-ig">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="#FFFFFF"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                </div>
                <span>Instagram</span>
            </a>
            <a href="https://whatsapp.com" target="_blank" rel="noopener" class="social-item">
                <div class="social-circle circle-wa">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="#FFFFFF"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.096 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                </div>
                <span>WhatsApp</span>
            </a>
            <a href="https://hits20radioonline.com" target="_blank" rel="noopener" class="social-item">
                <div class="social-circle circle-web">🌐</div>
                <span>Sitio Web</span>
            </a>
        </section>
    </main>

    <!-- Barra de navegación inferior con los logos exactos estilo vectorial de la segunda imagen -->
    <nav class="bottom-nav">
        <button class="tab-btn tab-active">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20 6H4c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H4V8h16v8zM6 10h2v4H6zm10 0h2v4h-2z"/></svg>
            RADIO
        </button>
        <button class="tab-btn" onclick="window.location.href='video.html'">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            VIDEO
        </button>
    </nav>

    <script>
        const audio = document.getElementById('radioStream');
        const playIcon = document.getElementById('playIcon');
        const volumeText = document.getElementById('volumeText');
        const songTitle = document.getElementById('songTitle');
        const cyberEqContainer = document.getElementById('cyberEq');

        audio.volume = 0.8;

        const totalBars = 32;
        const bars = [];

        for (let i = 0; i < totalBars; i++) {
            const bar = document.createElement('div');
            bar.className = 'cyber-bar';
            bar.style.height = '6px';
            cyberEqContainer.appendChild(bar);
            
            bars.push({
                element: bar,
                height: Math.random() * 45 + 8,
                speed: Math.random() * 0.3 + 0.15,
                angle: Math.random() * Math.PI
            });
        }

        let animationId = null;

        function updateCyberEqualizer() {
            if (audio.paused) return;

            bars.forEach((bar) => {
                bar.angle += bar.speed;
                const dynamicHeight = Math.abs(Math.sin(bar.angle) * 35) + Math.random() * 15 + 6;
                bar.element.style.height = dynamicHeight + 'px';
                
                if (dynamicHeight > 38) {
                    bar.element.style.boxShadow = '0 0 12px #FF1744';
                } else if (dynamicHeight > 22) {
                    bar.element.style.boxShadow = '0 0 10px #7C4DFF';
                } else {
                    bar.element.style.boxShadow = '0 0 8px #00E5FF';
                }
            });

            animationId = requestAnimationFrame(updateCyberEqualizer);
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    document.body.classList.remove('paused');
                    songTitle.innerText = "HITS 20 RADIO ONLINE V2";
                    playIcon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>';
                    if (!animationId) {
                        updateCyberEqualizer();
                    }
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.metadata = new MediaMetadata({
                            title: 'Hits 20 Radio Online v2',
                            artist: 'Transmisión Oficial',
                            album: 'En Vivo'
                        });
                    }
                }).catch(error => {
                    console.log("Error al reproducir el streaming:", error);
                });
            } else {
                audio.pause();
                document.body.classList.add('paused');
                songTitle.innerText = "PAUSADO";
                playIcon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>';
                
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                bars.forEach(bar => {
                    bar.element.style.height = '4px';
                    bar.element.style.boxShadow = 'none';
                });
            }
        }

        function changeVolume(val) {
            audio.volume = val / 100;
            volumeText.innerText = val + "%";
        }

        function toggleMenu() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Enlace copiado al portapapeles");
            }
        }
    </script>
</body>
</html>
