<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hits 20 Radio Online</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06b6d4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pwa-layout.css">
</head>
<body class="bg-black text-white font-sans antialiased overflow-hidden h-screen w-screen relative">

    <audio id="audioPlayer" src="https://stream.radiosmundiales.com:8692/stream" preload="auto" crossorigin="anonymous"></audio>

    <div class="absolute inset-0 z-0 bg-gradient-to-br from-indigo-950 via-slate-950 to-purple-950"></div>

    <div class="absolute inset-0 z-10 pointer-events-none flex items-center justify-center">
        <canvas id="vumeterCanvas" class="w-full h-full"></canvas>
    </div>

    <div class="absolute top-6 left-6 z-50">
        <button id="speakerBtn" class="w-12 h-12 rounded-full glass-panel flex items-center justify-center hover:bg-white/25 transition-all cursor-pointer shadow-lg text-lg">🎵</button>
        <div id="sliderContainer" class="hidden absolute top-16 left-0 glass-panel p-4 rounded-2xl flex flex-col items-center gap-2 shadow-2xl">
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
            <span id="volText" class="text-xs">50%</span>
        </div>
    </div>

    <div class="absolute inset-x-0 top-[8%] z-30 flex flex-col items-center gap-5 pointer-events-none">
        
        <div class="w-full flex flex-col items-center">
            <img src="assets/logo-centro.png" alt="Logo Hits 20 Radio Online" class="w-full max-w-[240px] md:max-w-[300px] h-auto object-contain filter drop-shadow-2xl">
        </div>

        <button id="playBtn" class="pointer-events-auto w-24 h-24 rounded-full glass-panel backdrop-blur-md bg-white/5 border border-white/20 flex items-center justify-center hover:scale-105 transition-all cursor-pointer shadow-2xl group glow-effect">
            <svg id="playIcon" class="w-10 h-10 text-white/80 group-hover:text-white transition-colors drop-shadow-md ml-1" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="pauseIcon" class="w-8 h-8 text-white/80 group-hover:text-white transition-colors drop-shadow-md hidden" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
        </button>

        <div id="socialRowContainer" class="social-row pointer-events-auto flex items-center justify-center gap-6"></div>

    </div>

    <div id="pwaInstallContainer" class="pwa-install-corner"></div>

    <script src="player-button.js"></script>
    <script src="socials.js"></script>
    <script src="pwa-install.js"></script>
    <script src="script.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registrado:', reg.scope))
            .catch(err => console.error('Error Service Worker:', err));
        });
      }
    </script>
</body>
</html>
