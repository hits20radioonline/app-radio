<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hits 20 Radio Online v3</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #030508;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            height: 100%;
            padding: 8px 12px;
            overflow-x: hidden;
        }

        header.top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .logo {
            width: 100%;
            max-height: 190px;
            object-fit: contain;
            margin: 2px 0;
        }

        .badge {
            background: linear-gradient(135deg, #FF1744, #D50000);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 23, 68, 0.5);
            margin: 2px 0;
        }

        .equalizer-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70px;
            position: relative;
            margin: 2px 0;
        }

        .cyber-equalizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            width: 100%;
            height: 100%;
        }

        .cyber-bar {
            width: 6px;
            background: linear-gradient(180deg, #FF1744, #7C4DFF, #00E5FF);
            border-radius: 4px;
            transition: height 0.04s ease, box-shadow 0.04s ease;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }

        .paused .cyber-bar {
            height: 4px !important;
            background: #0d162d !important;
            box-shadow: none !important;
        }

        .info-container {
            text-align: center;
        }
        .now-playing {
            color: #8A99AD;
            font-size: 8px;
            letter-spacing: 1px;
        }
        .song-title {
            font-size: 13px;
            font-weight: bold;
        }
        .song-artist {
            color: #B0BEC5;
            font-size: 10px;
        }

        .meta-row {
            display: flex;
            gap: 12px;
            font-size: 9px;
            color: #8FEFFF;
        }

        .play-btn {
            background: radial-gradient(circle, rgba(0,229,255,0.15) 0%, rgba(5,7,13,0.8) 70%);
            border: 2px solid #00E5FF;
            border-radius: 50%;
            cursor: pointer;
            width: 74px;
            height: 74px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3), inset 0 0 10px rgba(0, 229, 255, 0.2);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .play-btn:active {
            transform: scale(0.94);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
        }

        .volume-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
        }
        .volume-container input[type=range] {
            flex: 1;
            accent-color: #00E5FF;
            height: 4px;
        }

        .social-row {
            width: 100%;
            display: flex;
            justify-content: space-around;
        }
        .social-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        .social-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
        }
        .circle-fb { background-color: #1877F2; }
        .circle-ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #df5950 45%, #c62368 60%, #515ec4 90%); }
        .circle-wa { background-color: #25D366; }
        .circle-web { background-color: #121826; border: 1px solid #00E5FF; }
        .social-item span {
            font-size: 9px;
            color: #FFFFFF;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -260px;
            width: 260px;
            height: 100%;
            background-color: #05080f;
            border-right: 1px solid #121d33;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: left 0.3s ease;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        .side-menu.open {
            left: 0;
        }
        .menu-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #121d33;
            font-weight: bold;
            color: #00E5FF;
        }
        .menu-close {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .menu-items {
            display: flex;
            flex-direction: column;
            padding: 16px 0;
            gap: 4px;
            overflow-y: auto;
            max-height: calc(100vh - 60px);
        }
        .menu-item {
            padding: 10px 16px;
            color: #8A99AD;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
        }
        .menu-item:hover {
            background-color: #0e1726;
            color: #00E5FF;
        }

        /* Estilos de la nueva sección Redes en el Menú */
        .menu-section-title {
            padding: 12px 16px 6px 16px;
            font-size: 10px;
            color: #00E5FF;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .menu-social-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 0 16px 12px 16px;
        }
        .menu-social-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #8A99AD;
            font-size: 8px;
            gap: 4px;
        }
        .menu-social-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121826;
            border: 1px solid #1f2a40;
            font-size: 12px;
            font-weight: bold;
            color: #00E5FF;
            transition: border-color 0.2s;
        }
        .menu-social-btn:hover .menu-social-circle {
            border-color: #00E5FF;
        }

        .menu-overlay, .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 999;
            display: none;
        }
        .menu-overlay.open, .modal-overlay.open {
            display: block;
        }

        /* Ventana flotante (Modal) de Contacto */
        .contact-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 380px;
            background-color: #05080f;
            border: 1px solid #00E5FF;
            border-radius: 12px;
            z-index: 1001;
            padding: 16px;
            display: none;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.3);
            opacity: 0;
            transition: all 0.3s ease;
        }
        .contact-modal.open {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .contact-modal h3 {
            color: #00E5FF;
            font-size: 14px;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .form-group label {
            font-size: 9px;
            color: #8A99AD;
        }
        .form-group input, .form-group textarea {
            background-color: #030508;
            border: 1px solid #1f2a40;
            border-radius: 5px;
            color: white;
            padding: 6px 8px;
            font-size: 11px;
            outline: none;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #00E5FF;
        }
        .form-group textarea {
            resize: none;
            height: 60px;
        }
        .char-counter {
            font-size: 8px;
            color: #8A99AD;
            text-align: right;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #00E5FF, #00838F);
            color: #030508;
            border: none;
            padding: 9px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            margin-top: 4px;
            transition: opacity 0.2s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }

        nav.bottom-nav {
            width: calc(100% + 24px);
            height: 48px;
            background-color: #05080f;
            display: flex;
            margin: 0 -12px -8px -12px;
            border-top: 1px solid #121d33;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #8A99AD;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, color 0.2s;
            position: relative;
        }
        .tab-active {
            background-color: #0e1726;
            color: #00E5FF;
        }
        .tab-active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background-color: #00E5FF;
        }

        audio { display: none; }
    </style>
</head>

    <script>
        const audio = document.getElementById('radioStream');
        const playIcon = document.getElementById('playIcon');
        const volumeText = document.getElementById('volumeText');
        const songTitle = document.getElementById('songTitle');
        const cyberEqContainer = document.getElementById('cyberEq');
        const sideMenu = document.getElementById('sideMenu');
        const menuOverlay = document.getElementById('menuOverlay');

        audio.volume = 0.8;

        const totalBars = 32;
        const bars = [];

        for (let i = 0; i < totalBars; i++) {
            const bar = document.createElement('div');
            bar.className = 'cyber-bar';
            bar.style.height = '6px';
            cyberEqContainer.appendChild(bar);
            
            bars.push({
                element: bar,
                height: Math.random() * 45 + 8,
                speed: Math.random() * 0.3 + 0.15,
                angle: Math.random() * Math.PI
            });
        }

        let animationId = null;

        function updateCyberEqualizer() {
            if (audio.paused) return;

            bars.forEach((bar) => {
                bar.angle += bar.speed;
                const dynamicHeight = Math.abs(Math.sin(bar.angle) * 35) + Math.random() * 15 + 6;
                bar.element.style.height = dynamicHeight + 'px';
                
                if (dynamicHeight > 38) {
                    bar.element.style.boxShadow = '0 0 12px #FF1744';
                } else if (dynamicHeight > 22) {
                    bar.element.style.boxShadow = '0 0 10px #7C4DFF';
                } else {
                    bar.element.style.boxShadow = '0 0 8px #00E5FF';
                }
            });

            animationId = requestAnimationFrame(updateCyberEqualizer);
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    document.body.classList.remove('paused');
                    songTitle.innerText = "HITS 20 RADIO ONLINE V3";
                    playIcon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>';
                    if (!animationId) {
                        updateCyberEqualizer();
                    }
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.metadata = new MediaMetadata({
                            title: 'Hits 20 Radio Online v3',
                            artist: 'Transmisión Oficial',
                            album: 'En Vivo'
                        });
                    }
                }).catch(error => {
                    console.log("Error al reproducir el streaming:", error);
                });
            } else {
                audio.pause();
                document.body.classList.add('paused');
                songTitle.innerText = "PAUSADO";
                playIcon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>';
                
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                bars.forEach(bar => {
                    bar.element.style.height = '4px';
                    bar.element.style.boxShadow = 'none';
                });
            }
        }

        function changeVolume(val) {
            audio.volume = val / 100;
            volumeText.innerText = val + "%";
        }

        function toggleMenu() {
            sideMenu.classList.toggle('open');
            menuOverlay.classList.toggle('open');
        }

        function toggleContactModal() {
            document.getElementById('contactModal').classList.toggle('open');
            document.getElementById('modalOverlay').classList.toggle('open');
        }

        function updateCounter() {
            const msg = document.getElementById('conMsg');
            document.getElementById('charCount').innerText = msg.value.length;
        }

        function validateContactForm(event) {
            const msg = document.getElementById('conMsg').value;
            const urlPattern = /(http:\/\/|https:\/\/|www\.|\.com|\.net|\.org|\.ar|ftp:\/\/)/i;
            if (urlPattern.test(msg)) {
                alert("⚠️ Por seguridad, está prohibido incluir enlaces (links) en la descripción.");
                event.preventDefault();
                return false;
            }
            return true;
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({
                    title: 'Hits 20 Radio Online',
                    text: 'Escuchá Hits 20 Radio Online en vivo:',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert("¡Enlace copiado al portapapeles!");
                }).catch(() => {
                    prompt("Copiá este enlace para compartir:", window.location.href);
                });
            }
        }
    </script>
</body>
</html>
