<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hits 20 Radio Online v3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #030508; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 8px 12px; }

        /* Estilos del Menú Lateral */
        .side-menu {
            position: fixed; top: 0; left: -260px; width: 260px; height: 100%;
            background-color: #05080f; border-right: 1px solid #121d33;
            z-index: 1000; display: flex; flex-direction: column; transition: left 0.3s ease;
        }
        .side-menu.open { left: 0; }
        .menu-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #121d33; color: #00E5FF; font-weight: bold; }
        .menu-items { display: flex; flex-direction: column; padding: 16px 0; overflow-y: auto; max-height: calc(100vh - 60px); }
        .menu-item { padding: 12px 16px; color: #8A99AD; text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .menu-item:hover { background-color: #0e1726; color: #00E5FF; }

        /* Sección Redes en Menú */
        .menu-section-title { padding: 16px 16px 8px 16px; font-size: 10px; color: #00E5FF; letter-spacing: 1px; font-weight: bold; }
        .menu-social-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px 16px 16px; }
        .menu-social-btn { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #8A99AD; font-size: 8px; gap: 5px; }
        .menu-social-circle { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #121826; border: 1px solid #1f2a40; font-size: 12px; font-weight: bold; color: #00E5FF; }

        .menu-overlay, .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; display: none; }
        .menu-overlay.open, .modal-overlay.open { display: block; }

        /* Estilos de la Ventana Flotante (Modal de Contacto) */
        .contact-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            width: 90%; max-width: 400px; background-color: #080d1a; border: 1px solid #00E5FF;
            border-radius: 12px; z-index: 1001; padding: 20px; display: none;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.3); opacity: 0; transition: all 0.3s ease;
        }
        .contact-modal.open { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .contact-modal h3 { color: #00E5FF; font-size: 15px; margin-bottom: 15px; text-align: center; letter-spacing: 1px; }
        
        .form-group { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 10px; color: #8A99AD; }
        .form-group input, .form-group textarea {
            background-color: #030508; border: 1px solid #1f2a40; border-radius: 6px;
            color: white; padding: 8px; font-size: 12px; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #00E5FF; }
        .form-group textarea { resize: none; height: 70px; }
        
        .char-counter { font-size: 9px; color: #8A99AD; text-align: right; }
        
        .submit-btn {
            width: 100%; background: linear-gradient(135deg, #00E5FF, #00838F);
            color: #030508; border: none; padding: 10px; border-radius: 6px;
            font-weight: bold; font-size: 12px; cursor: pointer; margin-top: 5px;
            transition: opacity 0.2s;
        }
        .submit-btn:hover { opacity: 0.9; }

        .logo { width: 100%; max-height: 190px; object-fit: contain; }
        .play-btn { background: radial-gradient(circle, rgba(0,229,255,0.15) 0%, rgba(5,7,13,0.8) 70%); border: 2px solid #00E5FF; border-radius: 50%; width: 74px; height: 74px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div class="modal-overlay" id="modalOverlay" onclick="toggleContactModal()"></div>

    <!-- MENÚ LATERAL -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <span>MENÚ PRINCIPAL</span>
            <button onclick="toggleMenu()" style="background:none; border:none; color:white; cursor:pointer; font-size: 16px;">✕</button>
        </div>
        <div class="menu-items">
            <a href="#" class="menu-item" onclick="toggleMenu()">🏠 Inicio</a>
            <a href="video.html" class="menu-item">📺 Video</a>
            
            <div class="menu-section-title">REDES SOCIALES</div>
            <div class="menu-social-grid">
                <a href="https://www.youtube.com/@hits20radio" target="_blank" class="menu-social-btn">
                    <div class="menu-social-circle">YT</div>
                    <span>Youtube</span>
                </a>
                <a href="https://www.tiktok.com/@hits20online" target="_blank" class="menu-social-btn">
                    <div class="menu-social-circle">TT</div>
                    <span>TikTok</span>
                </a>
                <a href="https://www.threads.com/@hits20online" target="_blank" class="menu-social-btn">
                    <div class="menu-social-circle">TH</div>
                    <span>Threads</span>
                </a>
            </div>

            <a class="menu-item" onclick="toggleMenu(); toggleContactModal();">💬 Contacto</a>
            <a href="#" class="menu-item">ℹ️ Acerca de</a>
            <a href="#" class="menu-item" onclick="shareApp();">🔗 Compartir App</a>
        </div>
    </div>

    <!-- VENTANA FLOTANTE DE CONTACTO -->
    <div class="contact-modal" id="contactModal">
        <h3>CONTACTÁ CON HITS 20</h3>
        <!-- Usamos FormSubmit para que llegue directamente a hits20radioonline@gmail.com -->
        <form action="https://formsubmit.co/hits20radioonline@gmail.com" method="POST" onsubmit="return validateContactForm(event)">
            <!-- Configuraciones opcionales para FormSubmit -->
            <input type="hidden" name="_subject" value="Nuevo mensaje desde la App de Hits 20 Radio">
            <input type="hidden" name="_captcha" value="false">

            <div class="form-group">
                <label>Nombre y Apellido *</label>
                <input type="text" name="nombre" id="conName" required placeholder="Ej: Juan Pérez">
            </div>
            <div class="form-group">
                <label>Correo Electrónico *</label>
                <input type="email" name="email" id="conEmail" required placeholder="tucorreo@email.com">
            </div>
            <div class="form-group">
                <label>Teléfono *</label>
                <input type="tel" name="telefono" id="conPhone" required placeholder="Ej: 2664000000">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div class="form-group">
                    <label>Provincia *</label>
                    <input type="text" name="provincia" id="conProv" required placeholder="San Luis">
                </div>
                <div class="form-group">
                    <label>Ciudad *</label>
                    <input type="text" name="ciudad" id="conCity" required placeholder="Ciudad">
                </div>
            </div>
            <div class="form-group">
                <label>País *</label>
                <input type="text" name="pais" id="conCountry" required placeholder="Argentina">
            </div>
            <div class="form-group">
                <label>Descripción (Máximo 300 caracteres - Sin links) *</label>
                <textarea name="mensaje" id="conMsg" maxlength="300" required placeholder="Escribe tu mensaje aquí..." oninput="updateCounter()"></textarea>
                <div class="char-counter"><span id="charCount">0</span>/300</div>
            </div>
            
            <button type="submit" class="submit-btn">ENVIAR MENSAJE</button>
        </form>
    </div>

    <header style="width: 100%; display: flex; justify-content: space-between; padding: 10px;">
        <span style="font-size: 24px; cursor: pointer;" onclick="toggleMenu()">☰</span>
    </header>

    <main style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
        <img src="hits20_logo.png" alt="Hits 20 Logo" class="logo">
        <button class="play-btn" onclick="alert('Reproduciendo...')">▶</button>
    </main>

    <script>
        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('menuOverlay').classList.toggle('open');
        }

        function toggleContactModal() {
            document.getElementById('contactModal').classList.toggle('open');
            document.getElementById('modalOverlay').classList.toggle('open');
        }

        function updateCounter() {
            const msg = document.getElementById('conMsg');
            document.getElementById('charCount').innerText = msg.value.length;
        }

        function validateContactForm(event) {
            const msg = document.getElementById('conMsg').value;
            
            // Medida de seguridad: Bloquear links o URLs en la descripción
            const urlPattern = /(http:\/\/|https:\/\/|www\.|\.com|\.net|\.org|\.ar|ftp:\/\/)/i;
            if (urlPattern.test(msg)) {
                alert("⚠️ Por seguridad, está prohibido incluir enlaces (links) en la descripción.");
                event.preventDefault();
                return false;
            }
            return true;
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({ title: 'Hits 20 Radio', url: window.location.href });
            } else {
                alert("Enlace copiado al portapapeles");
            }
        }
    </script>
</body>
</html>
