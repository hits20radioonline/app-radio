name: Compilar Radio App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generar archivos faltantes (Wrapper)
        run: gradle wrapper

      - name: Dar permisos y Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Radio-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
